<!DOCTYPE html>

<html>
<head>
    <title>Income Prediction</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }

    h1{
        text-align:center;
    }

    form{
        display:grid;
        gap:10px;
    }

    input, select, button{
        padding:10px;
        font-size:14px;
    }

    button{
        background:#0078d4;
        color:white;
        border:none;
        cursor:pointer;
    }

    .result{
        margin-top:20px;
        padding:15px;
        background:#f2f2f2;
        border-radius:8px;
        font-weight:bold;
    }
</style>


</head>
<body>

<h1>Adult Income Prediction</h1>

<form action="/predict" method="POST">

<input type="number" name="age" placeholder="Age" required>

<select name="workclass" required>
    <option value="Private">Private</option>
    <option value="Self-emp-not-inc">Self-emp-not-inc</option>
    <option value="Local-gov">Local-gov</option>
    <option value="State-gov">State-gov</option>
    <option value="Federal-gov">Federal-gov</option>
</select>

<input type="number" name="fnlwgt" placeholder="fnlwgt" required>

<select name="education" required>
    <option value="Bachelors">Bachelors</option>
    <option value="HS-grad">HS-grad</option>
    <option value="Masters">Masters</option>
    <option value="Doctorate">Doctorate</option>
    <option value="Some-college">Some-college</option>
</select>

<input type="number" name="educational_num" placeholder="Educational Number" required>

<select name="marital_status" required>
    <option value="Never-married">Never-married</option>
    <option value="Married-civ-spouse">Married-civ-spouse</option>
    <option value="Divorced">Divorced</option>
    <option value="Separated">Separated</option>
</select>

<select name="occupation" required>
    <option value="Prof-specialty">Prof-specialty</option>
    <option value="Exec-managerial">Exec-managerial</option>
    <option value="Sales">Sales</option>
    <option value="Tech-support">Tech-support</option>
    <option value="Craft-repair">Craft-repair</option>
</select>

<select name="relationship" required>
    <option value="Husband">Husband</option>
    <option value="Wife">Wife</option>
    <option value="Not-in-family">Not-in-family</option>
    <option value="Own-child">Own-child</option>
    <option value="Unmarried">Unmarried</option>
</select>

<select name="race" required>
    <option value="White">White</option>
    <option value="Black">Black</option>
    <option value="Asian-Pac-Islander">Asian-Pac-Islander</option>
    <option value="Amer-Indian-Eskimo">Amer-Indian-Eskimo</option>
    <option value="Other">Other</option>
</select>

<select name="gender" required>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>

<input type="number" name="capital_gain" placeholder="Capital Gain" value="0" required>

<input type="number" name="capital_loss" placeholder="Capital Loss" value="0" required>

<input type="number" name="hours_per_week" placeholder="Hours Per Week" required>

<select name="native_country" required>
    <option value="United-States">United-States</option>
    <option value="India">India</option>
    <option value="Canada">Canada</option>
    <option value="England">England</option>
    <option value="Germany">Germany</option>
</select>

<button type="submit">Predict Income</button>


</form>

{% if prediction_text %}

<div class="result">
    {{ prediction_text }}
</div>
{% endif %}

</body>
</html>
